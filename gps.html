<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מסלול בשטח</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Secular+One&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
/* Layout: a field tool for one hand — saved-track list, then full-screen map views with a stats strip on top and big buttons at the bottom */
:root{
  --bg:#F1F3EC; --paper:#FBFCF8; --ink:#1E2A20; --muted:#5E6B5F; --line:#D5DBCD;
  --track:#2F5D3A; --flag:#D24A12; --obj:#B97A12; --obj-ink:#FFFFFF;
  --accent:#2F5D3A; --accent-ink:#FFFFFF; --cross:#6A4BB0; --ok:#2F7D46; --bad:#C2410C;
  --f-display:"Secular One","Assistant",system-ui,sans-serif;
  --f-body:"Assistant",system-ui,"Segoe UI",Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141A15; --paper:#1B231C; --ink:#E6ECE2; --muted:#9AA898; --line:#2F3A30;
  --track:#7FC08D; --flag:#FF7A3D; --obj:#E9B04A; --obj-ink:#1B1406;
  --accent:#7FC08D; --accent-ink:#0F1A11; --cross:#B9A2F0; --ok:#7FC08D; --bad:#FF8A5B; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#141A15; --paper:#1B231C; --ink:#E6ECE2; --muted:#9AA898; --line:#2F3A30;
  --track:#7FC08D; --flag:#FF7A3D; --obj:#E9B04A; --obj-ink:#1B1406;
  --accent:#7FC08D; --accent-ink:#0F1A11; --cross:#B9A2F0; --ok:#7FC08D; --bad:#FF8A5B; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
button{font:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--flag);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* home */
.home{max-width:720px;margin:0 auto;padding-block:16px 40px;display:flex;flex-direction:column;gap:16px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.backlink{color:var(--ink);font-weight:600;text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:7px 12px;background:var(--paper)}
.langsel{font:600 15px var(--f-body);padding:7px 8px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,6vw,34px);margin:0;line-height:1.15;text-wrap:balance}
.intro{margin:4px 0 0;color:var(--muted);max-width:60ch}
.btn{font-weight:700;font-size:17px;border-radius:12px;padding:12px 18px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;gap:10px}
.btn.ghost{background:var(--paper);color:var(--ink);border-color:var(--line);font-weight:600}
.btn.warn{background:var(--flag);border-color:var(--flag);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.big{width:100%;padding:16px;font-size:19px}
h2{font-family:var(--f-display);font-weight:400;font-size:21px;margin:8px 0 0}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.card .name{font-weight:700;font-size:18px;overflow-wrap:anywhere}
.card .meta{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.card .age{font-size:15px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.card .acts{display:flex;gap:8px;flex-wrap:wrap}
.card .acts .btn{padding:9px 14px;font-size:16px}
.card .done{font-size:13px;font-weight:700;color:var(--ok);border:1px solid var(--ok);border-radius:999px;padding:1px 8px;margin-inline-start:6px;vertical-align:middle}
.empty{color:var(--muted);background:var(--paper);border:1px dashed var(--line);border-radius:12px;padding:16px}
.draftbox{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--paper);border:1px solid var(--flag);border-radius:12px;padding:12px 14px}

/* map screens */
.screen{height:100%;display:grid;grid-template-rows:auto auto 1fr auto;background:var(--bg)}
.shead{display:flex;align-items:center;gap:10px;padding-block:calc(8px + env(safe-area-inset-top,0px)) 8px;background:var(--paper);border-bottom:1px solid var(--line)}
.shead .ttl{font-weight:700;font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:6px 12px;font-weight:600;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.stat{background:var(--paper);padding:6px 8px;text-align:center;min-width:0}
.stat .k{font-size:12px;color:var(--muted);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v{font-family:var(--f-mono);font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat .v small{display:block;font-size:12px;color:var(--muted);line-height:1.1}
.stat .v.ok{color:var(--ok)} .stat .v.bad{color:var(--bad)}
.mapwrap{position:relative;min-height:0}
.map{position:absolute;inset:0}
.banner{position:absolute;top:10px;inset-inline:10px;z-index:500;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.banner.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.banner.ok{border-color:var(--ok)}
.banner .note{display:block;margin-top:4px;font-weight:700;color:#7A5208;background:#FFF3D1;border-radius:6px;padding:3px 8px}
.notechip{position:absolute;bottom:24px;right:12px;z-index:500;border:1.5px solid #B97A12;background:#FFF3D1;color:#5A3D05;border-radius:12px;padding:10px 14px;font:700 15px var(--f-body);box-shadow:0 2px 8px rgba(0,0,0,.2);cursor:pointer}
.mk-art.hasnote span::after{content:'';position:absolute;top:-4px;right:-4px;width:7px;height:7px;border-radius:50%;background:#1E6FD9;border:2px solid #fff}
.mk-art span{position:relative}
dialog textarea{font:17px var(--f-body);padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);resize:vertical;min-height:70px}
.qnotes{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.qnotes button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:16px;padding:6px 11px;font:600 14px var(--f-body)}
.mapbtns{position:absolute;bottom:24px;left:12px;z-index:500;display:flex;flex-direction:column;gap:8px}
.mapbtns button{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:8px 10px;font-weight:600;font-size:14px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.mapbtns button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.bottom{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));background:var(--paper);border-top:1px solid var(--line)}
.bottom .btn{padding:15px 10px;font-size:18px}
.bottom.three{grid-template-columns:1.1fr 1fr 1fr}.bottom.three .btn{font-size:16px;padding-inline:6px}
.btn.miss{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.artres{display:grid;grid-template-columns:auto 1fr 1fr;gap:8px;align-items:center;margin-top:14px}
.artres b{font-family:var(--f-mono);padding-inline-end:4px}
.artres button{padding:9px 6px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);font:600 15px var(--f-body)}
.artres button.on.f{background:#2F9E55;border-color:#2F9E55;color:#fff}
.artres button.on.m{background:var(--bad);border-color:var(--bad);color:#fff}
.flagico{width:22px;height:22px;flex:none}
.note{font-size:13px;color:var(--muted);padding-block:6px;background:var(--paper)}

/* map markers */
.mk-flag svg{display:block}
.maplibregl-ctrl-bottom-right{margin-bottom:6px}
.mk-art{display:grid;place-items:center}
.mk-art span{width:19px;height:19px;transform:rotate(45deg);background:#E9A93A;border:2px solid #fff;border-radius:4px;display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.mk-art b{transform:rotate(-45deg);color:#1B1406;font:700 11px var(--f-body)}
.mk-art.found span{background:#2F9E55}
.mk-art.found b{color:#fff}
.mk-art.missed span{background:#C8442B}
.mk-art.missed b{color:#fff}
.mk-art.plan span{background:rgba(255,255,255,.88);border:2px dashed #B97A12;box-shadow:none}
.mk-art.plan b{color:#7A5208}
.mk-turn.plan{border-color:#C99A06;background:#FFF6CF}
.mk-turn.sharp{width:16px;height:16px;border-color:#C99A06;background:#C99A06}
.mk-turn{width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid #2F5D3A}
.mk-me{width:18px;height:18px;border-radius:50%;background:#1F6FEB;border:3px solid #fff;box-shadow:0 0 0 2px rgba(31,111,235,.35),0 1px 5px rgba(0,0,0,.4)}

/* dialogs */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--paper);color:var(--ink);padding:18px;width:min(420px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{font-family:var(--f-display);font-weight:400;font-size:21px;margin:0 0 10px}
dialog label{display:flex;flex-direction:column;gap:6px;font-weight:600}
dialog select{font:17px var(--f-body);padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.setgrid{display:flex;flex-direction:column;gap:12px}
.setgrid .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
dialog label.chk{flex-direction:row;align-items:center;gap:10px;font-weight:600}
dialog label.chk input{width:22px;height:22px}
.small{font-size:14px;color:var(--muted);margin:0}
dialog input{font:17px var(--f-body);padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.dacts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.sum{display:grid;grid-template-columns:1fr auto;gap:6px 14px;margin:0}
.sum dt{color:var(--muted)} .sum dd{margin:0;font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:end}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(200px + env(safe-area-inset-top,0px));z-index:1000;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-weight:600;max-width:calc(100vw - 32px)}
@media (prefers-reduced-motion:no-preference){.toast{transition:opacity .2s}}
</style>
</head>
<body>

<!-- home: saved tracks -->
<main id="home" class="home gut">
  <div class="topbar">
    <a class="backlink" href="index.html" data-i18n="backGen">מחולל המסלולים</a>
    <span style="display:flex;gap:8px">
      <button class="iconbtn" id="setBtnHome" data-i18n="settings">הגדרות</button>
      <select id="lang" class="langsel" aria-label="שפה">
        <option value="he">עברית</option><option value="en">English</option><option value="de">Deutsch</option>
      </select>
    </span>
  </div>
  <header>
    <h1 data-i18n="title">מסלול בשטח</h1>
    <p class="intro" data-i18n="intro"></p>
  </header>
  <div id="draftBox" class="draftbox" hidden>
    <span id="draftText"></span>
    <span style="display:flex;gap:8px">
      <button class="btn" id="draftResume" data-i18n="resume"></button>
      <button class="btn ghost" id="draftDiscard" data-i18n="discardDraft"></button>
    </span>
  </div>
  <button class="btn big" id="newTrack">
    <svg class="flagico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 22V3" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M6 4h12l-3 4 3 4H6z" fill="currentColor"/></svg>
    <span data-i18n="newTrack"></span>
  </button>
  <a class="btn ghost big" href="index.html" id="fromGen" data-i18n="fromGen"></a>
  <h2 data-i18n="savedTitle"></h2>
  <ul class="list" id="list"></ul>
  <p class="empty" id="empty" data-i18n="empty" hidden></p>
</main>

<!-- laying and following share one map screen -->
<section id="screen" class="screen" hidden>
  <div class="shead gut">
    <button class="iconbtn" id="exitBtn" data-i18n="back"></button>
    <div class="ttl" id="sTitle"></div>
    <button class="iconbtn" id="setBtn" data-i18n="settings"></button>
  </div>
  <div class="stats" id="stats"></div>
  <div class="mapwrap">
    <div id="map" class="map"></div>
    <div class="banner" id="banner" hidden></div>
    <button class="notechip" id="noteChip" hidden></button>
    <div class="mapbtns">
      <button id="rotBtn" aria-pressed="false"></button>
      <button id="followBtn" aria-pressed="true" data-i18n="center"></button>
      <button id="layerBtn"></button>
    </div>
  </div>
  <div>
    <p class="note gut" id="hintLine"></p>
    <div class="bottom gut">
      <button class="btn" id="mainBtn"></button>
      <button class="btn ghost" id="sideBtn"></button>
      <button class="btn miss" id="missBtn" hidden></button>
    </div>
  </div>
</section>

<dialog id="saveDlg">
  <form method="dialog" id="saveForm">
    <h3 data-i18n="saveTitle"></h3>
    <label for="nameIn"><span data-i18n="nameLabel"></span><input id="nameIn" maxlength="60" autocomplete="off"></label>
    <p class="intro" id="saveMeta"></p>
    <div class="dacts">
      <button type="button" class="btn ghost" id="saveDiscard" data-i18n="discardTrack"></button>
      <button type="submit" class="btn" id="saveOk" data-i18n="save"></button>
    </div>
  </form>
</dialog>
<dialog id="askDlg">
  <h3 id="askText"></h3>
  <div class="dacts">
    <button class="btn ghost" id="askNo" data-i18n="cancel"></button>
    <button class="btn warn" id="askYes"></button>
  </div>
</dialog>
<dialog id="noteDlg">
  <form method="dialog" id="noteForm">
    <h3 id="noteTitle"></h3>
    <label for="noteIn"><span data-i18n="noteLabel"></span><textarea id="noteIn" maxlength="140" rows="3"></textarea></label>
    <div class="qnotes" id="qNotes"></div>
    <div class="dacts">
      <button type="button" class="btn ghost" id="noteCancel" data-i18n="cancel"></button>
      <button type="submit" class="btn" data-i18n="save"></button>
    </div>
  </form>
</dialog>
<dialog id="sumDlg">
  <h3 data-i18n="sumTitle"></h3>
  <dl class="sum" id="sumList"></dl>
  <div class="artres" id="artRes"></div>
  <div class="dacts"><button class="btn" id="sumClose" data-i18n="close"></button></div>
</dialog>
<dialog id="setDlg">
  <form method="dialog" id="setForm">
    <h3 data-i18n="setTitle"></h3>
    <div class="setgrid">
      <div class="row">
        <label for="sAlert"><span data-i18n="setAlert"></span>
          <select id="sAlert"><option value="none" data-i18n="alNone"></option><option value="vibrate" data-i18n="alVib"></option><option value="voice" data-i18n="alVoice"></option></select></label>
        <label for="sAlertDist"><span data-i18n="setAlertDist"></span><select id="sAlertDist"></select></label>
      </div>
      <label for="sLead"><span data-i18n="setLead"></span><select id="sLead"></select></label>
      <p class="small" data-i18n="leadNote"></p>
      <label class="chk" for="sRotate"><input type="checkbox" id="sRotate"><span data-i18n="setRotate"></span></label>
    </div>
    <div class="dacts">
      <button type="button" class="btn ghost" id="setTest" data-i18n="setTest"></button>
      <button type="submit" class="btn" data-i18n="save"></button>
    </div>
  </form>
</dialog>
<dialog id="linkDlg">
  <h3 data-i18n="linkTitle"></h3>
  <p class="small" data-i18n="linkNote"></p>
  <label for="linkIn" style="margin-top:8px"><input id="linkIn" readonly dir="ltr"></label>
  <div class="dacts">
    <button class="btn ghost" id="linkClose" data-i18n="close"></button>
    <button class="btn" id="linkCopy" data-i18n="copyLink"></button>
  </div>
</dialog>
<div class="toast" id="toast" hidden></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
(function(){
/* ---------- languages (shares the choice with the generator page) ---------- */
const I18N={
he:{
  title:'מסלול בשטח',
  intro:'הנח מסלול בשטח תוך כדי הליכה וסמן חפצים בדרך. אחר כך צא עם הכלב, ועל המפה תראה את המסלול שהנחת, איפה אתה עכשיו, מתי מגיעה פנייה ואילו חפצים נמצאו.',
  backGen:'מחולל המסלולים',newTrack:'הנחת מסלול חדש',savedTitle:'מסלולים שמורים',
  empty:'עדיין אין מסלולים שמורים. כשתהיה בשטח, לחץ על "הנחת מסלול חדש".',
  listMeta:(m,s,a)=>`${m} מ' · ${s} צעדים · ${a} חפצים`,
  agedFor:t=>`מונח כבר ${t}`,trackedAfter:t=>`גושש אחרי ${t}`,runs:n=>n===1?'גישוש אחד':`${n} גישושים`,
  follow:'צא לגישוש',del:'מחק',delAsk:n=>`למחוק את "${n}"?`,cancel:'ביטול',
  draftLay:'יש הנחת מסלול שלא הסתיימה.',draftRun:t=>`יש גישוש שלא הסתיים: ${t}.`,resume:'המשך',discardDraft:'בטל אותה',
  back:'חזרה',layTitle:'הנחת מסלול',
  startLay:'התחל הנחה',stopLay:'סיים הנחה',markArt:'סמן חפץ',
  sTime:'זמן',sDist:'צעדים',sArts:'חפצים',sGps:'דיוק GPS',
  waitGps:'מחכה למיקום GPS…',
  gpsWeak:a=>`אות GPS חלש (±${a} מ'). כדאי לחכות שהדיוק ישתפר.`,
  gpsDenied:'אין גישה למיקום. אפשר גישה למיקום לאתר הזה בהגדרות הדפדפן ונסה שוב.',
  gpsNone:'הדפדפן הזה לא תומך במיקום.',
  layHint:'השאר את המסך דלוק והעמוד פתוח. מעבר לאפליקציה אחרת עוצר את המעקב עד שחוזרים, והקטע שהלכת בינתיים יסומן בקו ישר.',
  backGap:t=>`המעקב נעצר למשך ${t} כשהעמוד לא היה פתוח. הקטע שהלכת בינתיים סומן בקו ישר.`,
  preview:'הצג מסלול',sTurns:'פניות',previewHint:'זה המסלול שהונח: הדגל, הפניות והחפצים. כשהכלב מוכן, לחץ "צא לגישוש".',fromTrack:m=>`אתה במרחק ${m} מ' מהמסלול`,
  layReady:'עמוד בנקודת ההתחלה ולחץ "התחל הנחה". הדגל יונח איפה שאתה עומד.',
  artMarked:(k,s,m)=>`חפץ ${k} סומן · ${s} צעדים (${m} מ') מה${k>1?'חפץ הקודם':'דגל'}`,
  sTrack:'מסלול',sSinceFlag:'מהדגל',sSinceArt:k=>`מחפץ ${k}`,tooShort:'המסלול קצר מדי. לך לפחות כמה מטרים לפני שמסיימים.',
  saveTitle:'שמירת המסלול',nameLabel:'שם המסלול',save:'שמור',discardTrack:'מחק בלי לשמור',
  saveMeta:(m,s,a,t)=>`${m} מ' (${s} צעדים), ${a} חפצים, ${t} הליכה. הזמן ממשיך לרוץ עד שתתחיל לגשש.`,

const DIRS={he:'rtl',en:'ltr',de:'ltr'};
const $=id=>document.getElementById(id);
function load(k){try{return localStorage.getItem(k)}catch(e){return null}}
function store(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function drop(k){try{localStorage.removeItem(k)}catch(e){}}
let lang=DIRS[load('trk-lang')]?load('trk-lang'):'he';
function T(k,...a){const d=I18N[lang];const v=k in d?d[k]:I18N.he[k];return typeof v==='function'?v(...a):v}
function applyLang(){
  document.documentElement.lang=lang;document.documentElement.dir=DIRS[lang];document.title=T('title');
  document.querySelectorAll('[data-i18n]').forEach(e=>{e.textContent=T(e.dataset.i18n)});
  $('lang').value=lang;
  if(typeof fillSettings==='function')fillSettings();
}

/* ---------- geometry ---------- */
const STEP=0.75; // meters per step
const R=6371000,rad=d=>d*Math.PI/180;
function hav(a,b){const dLa=rad(b[0]-a[0]),dLo=rad(b[1]-a[1]),s=Math.sin(dLa/2)**2+Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(s))}
// flat x/y in meters around an origin (east, north): plenty accurate for a field
function projector(o){const kx=Math.cos(rad(o[0]))*111320,ky=110540;return p=>[(p[1]-o[1])*kx,(p[0]-o[0])*ky]}
function rdp(pts,eps){

// The plan comes as the generator's track code (M-...): legs as heading + steps (an arc is ~heading>steps),

// In the plan "up" is the direction the layer faces at the flag.
const R2=Math.SQRT1_2,PD=[[0,-1],[R2,-R2],[1,0],[R2,R2],[0,1],[-R2,R2],[-1,0],[-R2,-R2]],HC=['U','UR','R','DR','D','DL','L','UL'];

function onLeg(p,l,off){

// One animation loop: the position dot glides to each new GPS reading and the map eases to the phone's heading.

  requestAnimationFrame(frame);

  let moved=false;
  if(lastPos&&meMk){
    if(!shownPos)shownPos=lastPos.slice();
    const dl=lastPos[0]-shownPos[0],dn=lastPos[1]-shownPos[1];
    if(Math.abs(dl)>1e-8||Math.abs(dn)>1e-8){shownPos[0]+=dl*0.12;shownPos[1]+=dn*0.12;meMk.setLngLat(lnglat(shownPos));moved=true}
  }
  if(freeRot)shownBear=map.getBearing(); // turned by hand: keep whatever the fingers left
  const want=freeRot?shownBear:mode==='view'||mode==='preview'||!cfg.rotate?0:(heading==null?shownBear:heading); // bearing = the compass direction shown at the top
  const d=((want-shownBear+540)%360)-180,turn=Math.abs(d)>0.1;

  if(follow&&shownPos&&(moved||turn||map.getBearing()!==shownBear))map.jumpTo({center:lnglat(shownPos),bearing:shownBear});

    if(!meMk){meMk=marker(lastPos,'me');shownPos=lastPos.slice();if(follow)map.jumpTo({center:lnglat(lastPos),zoom:18})}

let lay=null,layLine=null,layArtMk=[],layFlag=null,plan=null,planDrawn=[],planG=null,planKey='',planProg=null;
function startLay(draft,newPlan){
  mode='lay';setTimeout(syncRotBtn,0);lay=draft;plan=lay&&lay.plan?lay.plan:(newPlan||null);planG=null;planKey='';planDrawn=[];planProg=null;planFix.loc=null;
  openScreen(plan?plan.name:T('layTitle'));clearMap();layLine=null;layArtMk=[];layFlag=null;startCompass();
  if(lay)drawLay();
  startGps((p,acc,t)=>{
    if(lay&&acc<=GOOD_ACC){const last=lay.pts[lay.pts.length-1];if(!last||hav(last,p)>=2){lay.pts.push([p[0],p[1],t]);store('gps-lay',JSON.stringify(lay));drawLay()}}
    if(lay&&plan)planFix(p);
    renderLay();
  });
  clearInterval(tick);tick=setInterval(renderLay,1000);
  renderLay();
}
function drawLay(){
  const data={type:'Feature',geometry:{type:'LineString',coordinates:lay.pts.map(lnglat)}};
  if(!layLine)layLine=casedLine(lay.pts,'#2F9E55');
  else whenReady(()=>{const s=map.getSource(layLine.id);s&&s.setData(data)});
  if(!layFlag&&lay.pts.length)layFlag=marker(lay.pts[0],'flag');
  layArtMk.forEach(m=>m.remove());layArtMk=lay.arts.map((a,k)=>marker(a.ll,'art',{k:k+1,note:a.note,onClick:()=>editNote(k)}));
}
// Draw the plan. Before the start it follows you and the phone's heading, so you can see where it will go;
// at the start it is pinned to the flag. Redrawn only when its position or heading really changed.
function drawPlan(){
  if(!plan)return;
  let anchor,hd;
  if(lay){if(!plan.anchor)return;anchor=plan.anchor;hd=plan.heading}
  else{if(!lastPos)return;anchor=lastPos;hd=heading!=null?heading:0}
  if(hd==null)return; // started without a compass: waits for the first meters walked
  const key=anchor.map(v=>v.toFixed(5)).join()+'|'+Math.round(hd/3);
  if(key===planKey)return;planKey=key;
  planDrawn.forEach(x=>x.remove());drawn=drawn.filter(x=>!planDrawn.includes(x));planDrawn=[];
  planG=planGeo(plan,anchor,hd);
  planG.cross.forEach(c=>planDrawn.push(casedLine(c,'#7B4FD6',true)));
  planDrawn.push(casedLine(planG.ll,'#E8B500',true));
  planG.turns.forEach(t=>planDrawn.push(marker(t.ll,'turn',{plan:true,sharp:t.sharp})));
  planG.arts.forEach(a=>planDrawn.push(marker(a.ll,'art',{k:a.k+1,plan:true})));
}
// while laying: pin a plan that waited for a direction, then follow progress along it
function planFix(p){
  if(!plan.anchor)return;
  if(plan.heading==null){ // no compass: the first 10 m walked set the direction
    if(hav(plan.anchor,p)<10)return;
    const P=projector(plan.anchor),q=P(p);plan.heading=(Math.atan2(q[0],q[1])*180/Math.PI+360)%360;
    lay.plan=plan;store('gps-lay',JSON.stringify(lay));drawPlan();
  }
  if(!planG)return;
  const loc=locate(planG,p,planProg);planFix.loc=loc;
  if(loc.d<=20)planProg=Math.max(planProg||0,loc.cum);
  if(cfg.alert!=='none'&&loc.d<=OFF){
    lay.alerted=lay.alerted||{t:[],a:[]};const at=planProg||0;
    planG.turns.forEach((t,i)=>{const ahead=t.cum-at;if(!lay.alerted.t.includes(i)&&ahead<=cfg.alertDist&&ahead>-3){lay.alerted.t.push(i);alertNow(cfg.alert,T('planTurn',T(t.dir),t.sharp,steps(Math.max(0,ahead))),'turn')}});
    planG.arts.forEach(a=>{const ahead=a.cum-at;if(!lay.alerted.a.includes(a.k)&&ahead<=cfg.alertDist&&ahead>-3){lay.alerted.a.push(a.k);alertNow(cfg.alert,T('planArt',a.k+1,steps(Math.max(0,ahead))),'art')}});
  }
}
// the banner while laying a plan: off the plan first, then the next article, then the next turn
function planBanner(){
  if(!lay){banner(heading==null?T('planNoHeading'):'');return}
  if(!planG){banner(T('planNoHeading'));return}
  const loc=planFix.loc;if(!loc){banner('');return}
  if(loc.d>OFF){banner(T('offPlan',Math.round(loc.d)),'bad');return}
  const at=planProg||0,done=lay.arts.length;
  const art=planG.arts.filter(a=>a.k>=done).map(a=>({k:a.k,ahead:a.cum-at})).filter(a=>a.ahead>-6)[0];
  const turn=planG.turns.find(t=>t.cum>at+2);
  if(art&&art.ahead<=20&&(!turn||art.ahead<=turn.cum-at)){banner(T('planArt',art.k+1,steps(Math.max(0,art.ahead))),'ok');return}
  if(turn){banner(T('planTurn',T(turn.dir),turn.sharp,steps(turn.cum-at)),'ok');return}
  banner(T('planEnd',steps(Math.max(0,planG.len-at))),'ok');
}
function renderLay(){
  if(mode!=='lay')return;
  drawPlan();
  const m=lay?pathLen(lay.pts):0,na=lay?lay.arts.length:0,leg=na?m-lay.arts[na-1].cum:m;
  setStats([[T('sTime'),lay?fmtT(Date.now()-lay.start):'0:00'],[T('sTrack'),steps(m),'',T('m',Math.round(m))],
    [na?T('sSinceArt',na):T('sSinceFlag'),steps(leg),'',T('m',Math.round(leg))],
    [T('sGps'),lastAcc!=null?'±'+lastAcc:'–',lastAcc!=null&&lastAcc>GOOD_ACC?'bad':'']]);
  const mb=$('mainBtn'),sb=$('sideBtn');
  mb.innerHTML=lay?'<svg class="flagico" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2" fill="currentColor"/></svg><span></span>':'<svg class="flagico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 22V3" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M6 4h12l-3 4 3 4H6z" fill="currentColor"/></svg><span></span>';
  mb.querySelector('span').textContent=lay?T('stopLay'):T('startLay');
  mb.className=lay?'btn warn':'btn';mb.disabled=!lay&&!lastPos;
  sb.textContent=T('markArt');sb.disabled=!lay||!lastPos;
  $('hintLine').textContent=plan?(lay?T('planHint'):T('planReady',plan.name,plan.total)):lay?T('layHint'):T('layReady');
  if(!lastPos)banner(T('waitGps'));else if(lastAcc>GOOD_ACC)banner(T('gpsWeak',lastAcc),'bad');else if(plan)planBanner();else banner('');
}
function layMain(){
  if(!lay){ // start: the flag goes where you stand
    if(!lastPos)return;
    lay={start:Date.now(),pts:[[lastPos[0],lastPos[1],Date.now()]],arts:[]};
    // a plan is pinned here, pointing where the phone points (or, with no compass, where you walk first)
    if(plan){plan.anchor=lastPos.slice();plan.heading=heading!=null?heading:null;lay.plan=plan;planKey='';planProg=0;if(plan.heading==null)toast(T('planNoHeading'))}
    store('gps-lay',JSON.stringify(lay));drawLay();buzz(80);renderLay();return;
  }
  // finish: add the last position, then name and save
  if(lastPos&&hav(lay.pts[lay.pts.length-1],lastPos)>=1)lay.pts.push([lastPos[0],lastPos[1],Date.now()]);
  if(pathLen(lay.pts)<5){toast(T('tooShort'));return}
  lay.end=Date.now();store('gps-lay',JSON.stringify(lay));
  const m=Math.round(pathLen(lay.pts)),d=new Date(lay.start);
  const when=d.toLocaleDateString(lang==='he'?'he-IL':lang,{day:'numeric',month:'numeric'})+' '+d.toLocaleTimeString(lang==='he'?'he-IL':lang,{hour:'2-digit',minute:'2-digit'});
  $('nameIn').value=plan?`${plan.name} · ${when}`:T('defName',when);
  $('saveMeta').textContent=T('saveMeta',m,steps(m),lay.arts.length,fmtT(lay.end-lay.start));
  $('saveDlg').showModal();setTimeout(()=>$('nameIn').select(),50);
}
// a note on an article, for whoever tracks it later ("under the bush", "on the road edge")
let noteK=null,noteChipTimer=null;
function offerNote(k){
  const c=$('noteChip');c.textContent=T('addNote',k+1);c.hidden=false;c.onclick=()=>editNote(k);
  clearTimeout(noteChipTimer);noteChipTimer=setTimeout(()=>{c.hidden=true},15000);
}
function editNote(k){
  if(!lay||!lay.arts[k])return;noteK=k;$('noteChip').hidden=true;
  $('noteTitle').textContent=T('noteTitle',k+1);$('noteIn').value=lay.arts[k].note||'';
  $('qNotes').innerHTML='';T('quickNotes').forEach(q=>{const b=document.createElement('button');b.type='button';b.textContent=q;
    b.onclick=()=>{const v=$('noteIn').value.trim();$('noteIn').value=v?v+', '+q:q};$('qNotes').append(b)});
  $('noteDlg').showModal();
}
$('noteCancel').onclick=()=>$('noteDlg').close();
$('noteForm').onsubmit=e=>{
  e.preventDefault();$('noteDlg').close();
  if(!lay||noteK==null||!lay.arts[noteK])return;
  const v=$('noteIn').value.trim().slice(0,140);if(v)lay.arts[noteK].note=v;else delete lay.arts[noteK].note;
  store('gps-lay',JSON.stringify(lay));drawLay();if(v)toast(T('noteSaved',noteK+1));
};
function layMark(){
  if(!lay||!lastPos)return;
  const last=lay.pts[lay.pts.length-1],prevCum=lay.arts.length?lay.arts[lay.arts.length-1].cum:0;
  if(hav(last,lastPos)>=1)lay.pts.push([lastPos[0],lastPos[1],Date.now()]);
  lay.arts.push({ll:[lastPos[0],lastPos[1]],cum:pathLen(lay.pts),t:Date.now()});
  store('gps-lay',JSON.stringify(lay));drawLay();buzz(60);const seg=lay.arts[lay.arts.length-1].cum-prevCum;toast(T('artMarked',lay.arts.length,steps(seg),Math.round(seg)));offerNote(lay.arts.length-1);renderLay();
}
$('saveForm').onsubmit=e=>{
  e.preventDefault();
  const name=$('nameIn').value.trim()||$('nameIn').placeholder||T('defName','');
  // what is saved is the track actually walked; the plan is kept only as a note of where it came from
  const tr={id:'t'+Date.now().toString(36),name,start:lay.start,end:lay.end,pts:lay.pts,arts:lay.arts.map(a=>Object.assign({ll:a.ll,cum:a.cum,t:a.t},a.note?{note:a.note}:{})),runs:[],plan:plan?{code:plan.code,name:plan.name}:undefined};
  const all=tracks();all.push(tr);saveTracks(all);drop('gps-lay');lay=null;plan=null;$('saveDlg').close();$('noteChip').hidden=true;
  stopGps();keepAwake(false);clearMap();toast(T('saved'));renderHome();
};
$('saveDiscard').onclick=async()=>{$('saveDlg').close();if(await ask(T('discardAsk'),T('discardYes'))){drop('gps-lay');lay=null;plan=null;stopGps();keepAwake(false);clearMap();renderHome()}else $('saveDlg').showModal()};

/* ---------- following ---------- */
// state while tracking: {id,start,age,found:[],missed:[],path:[[lat,lng,t,dev]],prog}
let tr=null,geo=null,run=null,runLine=null,artMk=[],wasOff=false,lastProg=null;
const OFF=10; // meters from the laid track that count as "off"
function startFollow(id,resume,preview){
  tr=tracks().find(x=>x.id===id);if(!tr)return renderHome();
  const finished=!resume&&tr.runs&&tr.runs.length;
  mode=finished?'view':preview?'preview':'follow';setTimeout(syncRotBtn,0);run=resume||null;openScreen(tr.name);clearMap();runLine=null;lastProg=run?run.prog:null;wasOff=false;
  geo=prepare(tr);
  casedLine(tr.pts,'#2F9E55');
  geo.turns.forEach(t=>marker(t.ll,'turn'));
  marker(tr.pts[0],'flag');
  if(finished){
    const r=tr.runs[tr.runs.length-1];run=null;viewRun=r;
    artMk=tr.arts.map((a,k)=>marker(a.ll,'art',{k:k+1,found:r.found.includes(k),missed:(r.missed||[]).includes(k),note:a.note,onClick:()=>a.note&&toast(T('artN',k+1)+': '+a.note)}));
    if(r.path.length)casedLine(r.path,'#7B4FD6',true);
    shownBear=0;map.setBearing(0);
    fitTo(tr.pts.concat(r.path));setFollow(false);
    clearInterval(tick);renderView();return;
  }
  drawArts();if(run)drawRun();
  if(preview){shownBear=0;map.setBearing(0)}
  fitTo(tr.pts);setFollow(!!run);
  startGps((p,acc,t)=>{
    const loc=locate(geo,p,lastProg);
    if(run&&acc<=GOOD_ACC){
      if(loc.d<=OFF*2)lastProg=Math.max(lastProg||0,loc.cum);
      const last=run.path[run.path.length-1];
      if(!last||hav(last,p)>=2){run.path.push([p[0],p[1],t,Math.round(loc.d)]);run.prog=lastProg;store('gps-run',JSON.stringify(run));drawRun()}
      const off=loc.d>OFF;if(off&&!wasOff)buzz([200,100,200]);wasOff=off;
    }
    curLoc=loc;if(run)checkAlerts();renderFollow();
  });
  clearInterval(tick);tick=setInterval(renderFollow,1000);renderFollow();
}
// preview: the whole saved track north-up, with its numbers; your position shows if GPS is on
function renderPreview(){
  setStats([[T('sAge'),fmtT(Date.now()-tr.start)],[T('sDist'),steps(geo.len),'',T('m',Math.round(geo.len))],[T('sTurns'),geo.turns.length],[T('sArts'),tr.arts.length]]);
  $('mainBtn').textContent=T('follow');$('mainBtn').className='btn';$('mainBtn').disabled=false;
  $('sideBtn').textContent=T('share');$('sideBtn').disabled=false;
  $('hintLine').textContent=T('previewHint');
  if(lastPos&&curLoc)banner(T('fromTrack',Math.round(curLoc.d)));else banner('');
}
let curLoc=null,viewRun=null;
function drawArts(){
  artMk.forEach(m=>m.remove());
  artMk=tr.arts.map((a,k)=>marker(a.ll,'art',{k:k+1,found:!!(run&&run.found.includes(k)),missed:!!(run&&run.missed&&run.missed.includes(k)),note:tr.arts[k].note,onClick:()=>run?toggleFound(k):tr.arts[k].note&&toast(T('artN',k+1)+': '+tr.arts[k].note)}));
}
function drawRun(){
  if(!runLine){runLine=casedLine(run.path,'#7B4FD6',true);return}
  whenReady(()=>{const s=map.getSource(runLine.id);s&&s.setData({type:'Feature',geometry:{type:'LineString',coordinates:run.path.map(lnglat)}})});
}
// an article is open, found or not found. Tapping its marker goes open → found → not found → open.
function setArt(k,state,how){
  if(!run)return;run.missed=run.missed||[];run.noAuto=run.noAuto||[];
  run.found=run.found.filter(x=>x!==k);run.missed=run.missed.filter(x=>x!==k);
  if(state==='found'){run.found.push(k);buzz(how==='auto'?[80,60,80]:60);toast(how==='auto'?T('autoFound',k+1):resolvedAll()?T('allDone'):T('foundMsg',k+1))}
  else if(state==='missed'){run.missed.push(k);buzz(60);toast(T('missedMsg',k+1))}
  else{if(!run.noAuto.includes(k))run.noAuto.push(k);toast(T('unfoundMsg',k+1))} // undone by hand: never auto-mark it again
  store('gps-run',JSON.stringify(run));drawArts();renderFollow();
}
const resolvedAll=()=>run.found.length+(run.missed||[]).length>=tr.arts.length;
function toggleFound(k){
  if(!run)return;
  setArt(k,run.found.includes(k)?'missed':(run.missed||[]).includes(k)?'open':'found');
}
// standing still for 10 seconds near an open article (the dog is down on it) marks it found
const STILL_MS=10000,STILL_M=5;
let still=null;
function checkStill(){
  if(!run||!lastPos||lastAcc>GOOD_ACC){still=null;return}
  if(!still||hav(still.at,lastPos)>STILL_M){still={at:lastPos.slice(),t:Date.now()};return}
  if(Date.now()-still.t<STILL_MS)return;
  const reach=Math.max(8,cfg.lead+6),noAuto=run.noAuto||[],missed=run.missed||[];
  const near=tr.arts.map((a,k)=>({k,d:hav(a.ll,lastPos)})).filter(x=>x.d<=reach&&!run.found.includes(x.k)&&!missed.includes(x.k)&&!noAuto.includes(x.k)).sort((a,b)=>a.d-b.d)[0];
  if(near){setArt(near.k,'found','auto');still.t=Date.now()}
}
function renderFollow(){
  if(mode==='preview')return renderPreview();
  if(mode!=='follow')return;
  checkStill();
  const age=run?run.age:Date.now()-tr.start,n=tr.arts.length,f=run?run.found.length:0;
  const d=curLoc?Math.round(curLoc.d):null;
  setStats([[T('sAge'),fmtT(age)],[T('sRun'),run?fmtT(Date.now()-run.start):'–'],[T('sOff'),d!=null?T('m',d):'–',d==null?'':d>OFF?'bad':'ok'],[T('sFound'),`${f}/${n}`]]);
  const mb=$('mainBtn'),sb=$('sideBtn');
  mb.textContent=run?T('stopRun'):T('startRun');mb.className=run?'btn warn':'btn';mb.disabled=false;
  sb.textContent=T('artFound');sb.disabled=!run||resolvedAll();
  const xb=$('missBtn');xb.hidden=!run;xb.textContent=T('artMissed');xb.disabled=!run||resolvedAll();$('screen').querySelector('.bottom').classList.toggle('three',!!run);
  $('hintLine').textContent=run?T('runHint'):T('runReady');
  // banner: off-track warning first, then a close article, then the next turn
  if(!lastPos){banner(T('waitGps'));return}
  if(lastAcc>GOOD_ACC){banner(T('gpsWeak',lastAcc),'bad');return}
  if(!run||!curLoc){banner('');return}
  if(curLoc.d>OFF){banner(T('offBy',Math.round(curLoc.d)),'bad');return}
  const prog=(lastProg||0)+cfg.lead; // where the dog is, about this far ahead of the handler
  const near=tr.arts.map((a,k)=>({k,ahead:a.cum-prog})).filter(x=>!run.found.includes(x.k)&&!(run.missed||[]).includes(x.k)&&x.ahead>-8&&x.ahead<15).sort((a,b)=>a.ahead-b.ahead)[0];
  if(near){banner(T('nearArt',near.k+1).replace('{m}',Math.max(0,Math.round(near.ahead))),'ok',tr.arts[near.k].note);return}
  const nt=geo.turns.find(t=>t.cum>prog+3);
  banner(nt?T('nextTurn',T(nt.dir),Math.round(nt.cum-prog)):T('endIn',Math.max(0,Math.round(geo.len-prog))),'ok');
}
async function followMain(){
  if(!run){
    run={id:tr.id,start:Date.now(),age:Date.now()-tr.start,found:[],missed:[],noAuto:[],path:[],prog:0};still=null;lastProg=0;
    if(lastPos)run.path.push([lastPos[0],lastPos[1],Date.now(),curLoc?Math.round(curLoc.d):0]);
    store('gps-run',JSON.stringify(run));setFollow(true);buzz(80);if(cfg.alert==='voice')primeVoice();drawArts();renderFollow();return;
  }
  if(!(await ask(T('stopAsk'),T('stopYes'))))return;
  run.end=Date.now();
  const devs=run.path.map(p=>p[3]),maxDev=devs.length?Math.max(...devs):0,onPct=devs.length?Math.round(100*devs.filter(x=>x<=OFF).length/devs.length):0;
  const prog=Math.min(100,Math.round(100*(run.prog||0)/geo.len));
  const rec={start:run.start,end:run.end,age:run.age,found:run.found.slice(),missed:(run.missed||[]).slice(),path:run.path,maxDev,onPct,prog};
  const all=tracks(),t=all.find(x=>x.id===tr.id);if(t){t.runs=t.runs||[];t.runs.push(rec);saveTracks(all)}
  drop('gps-run');run=null;speechStop();$('missBtn').hidden=true;$('screen').querySelector('.bottom').classList.remove('three');
  // the track is done: reopen it read-only, then show the summary
  stopGps();startFollow(tr.id);showSummary(rec);
}
function showSummary(rec){
  rec.missed=rec.missed||[];
  const rows=[[T('sumAge'),fmtT(rec.age)],[T('sumTime'),fmtT(rec.end-rec.start)],[T('sumFound'),T('sumOf',rec.found.length,tr.arts.length)],...(rec.missed.length?[[T('sumMissed'),rec.missed.length]]:[]),[T('sumMax'),T('m',rec.maxDev)],[T('sumOn'),rec.onPct+'%'],[T('sumProg'),rec.prog+'%']];
  $('sumList').innerHTML='';rows.forEach(([k,v])=>{const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=k;dd.textContent=v;$('sumList').append(dt,dd)});
  // set each article found or not found, also the ones the dog skipped or never indicated
  const box=$('artRes');box.innerHTML='';
  tr.arts.forEach((a,k)=>{
    const st=rec.found.includes(k)?'f':rec.missed.includes(k)?'m':'';
    const lbl=document.createElement('b');lbl.textContent=T('artN',k+1);box.append(lbl);
    [['f',T('resFound')],['m',T('resMissed')]].forEach(([c,txt])=>{const b=document.createElement('button');b.type='button';b.className=c+(st===c?' on':'');b.textContent=txt;
      b.onclick=()=>{rec.found=rec.found.filter(x=>x!==k);rec.missed=rec.missed.filter(x=>x!==k);if(st!==c)(c==='f'?rec.found:rec.missed).push(k);saveRun(rec);showSummary(rec)};box.append(b)});
  });
  if(!$('sumDlg').open)$('sumDlg').showModal();
}
// write the edited result back into the saved track and redraw the finished view
function saveRun(rec){
  const all=tracks(),t=all.find(x=>x.id===tr.id);if(!t||!t.runs)return;
  const r=t.runs.find(x=>x.start===rec.start);if(!r)return;r.found=rec.found.slice();r.missed=rec.missed.slice();saveTracks(all);
  tr=t;if(mode==='view'){viewRun=r;artMk.forEach(m=>m.remove());artMk=tr.arts.map((a,k)=>marker(a.ll,'art',{k:k+1,found:r.found.includes(k),missed:r.missed.includes(k)}));renderView()}
}
function renderView(){
  const r=viewRun;
  setStats([[T('sAge'),fmtT(r.age)],[T('sRun'),fmtT(r.end-r.start)],[T('sumOn'),r.onPct+'%'],[T('sFound'),`${r.found.length}/${tr.arts.length}`]]);
  $('mainBtn').textContent=T('showSum');$('mainBtn').className='btn';$('mainBtn').disabled=false;
  $('sideBtn').textContent=T('share');$('sideBtn').disabled=false;
  $('hintLine').textContent=T('doneHint');banner('');syncRotBtn();
}
// "article found" marks the closest unfound article along the track (or the next one in order)
function followSide(){
  if(!run)return;
  const prog=(lastProg||0)+cfg.lead,left=tr.arts.map((a,k)=>({k,d:Math.abs(a.cum-prog)})).filter(x=>!run.found.includes(x.k)&&!(run.missed||[]).includes(x.k)).sort((a,b)=>a.d-b.d);
  if(left.length)setArt(left[0].k,'found');
}
$('missBtn').onclick=()=>{
  if(!run)return;
  const prog=(lastProg||0)+cfg.lead,left=tr.arts.map((a,k)=>({k,d:Math.abs(a.cum-prog)})).filter(x=>!run.found.includes(x.k)&&!(run.missed||[]).includes(x.k)).sort((a,b)=>a.d-b.d);
  if(left.length)setArt(left[0].k,'missed');
};
$('sumClose').onclick=()=>$('sumDlg').close();
$('mainBtn').onclick=()=>{if(mode==='lay')layMain();else if(mode==='view')showSummary(viewRun);else if(mode==='preview'){startCompass();stopGps();startFollow(tr.id)}else followMain()};
$('sideBtn').onclick=()=>{if(mode==='lay')layMark();else if(mode==='view'||mode==='preview')shareTrack(tr);else followSide()};

/* ---------- settings ---------- */
const DEF={alert:'vibrate',alertDist:10,lead:0,rotate:true};
let cfg=(()=>{try{return Object.assign({},DEF,JSON.parse(load('gps-settings')||'{}'))}catch(e){return Object.assign({},DEF)}})();
function fillSettings(){
  const dist=$('sAlertDist'),lead=$('sLead');
  dist.innerHTML=[5,10,15,20,30].map(v=>`<option value="${v}">${T('m',v)}</option>`).join('');
  lead.innerHTML=[0,5,10].map(v=>`<option value="${v}">${v?T('m',v):T('lead0')}</option>`).join('');
  $('sAlert').value=cfg.alert;dist.value=cfg.alertDist;lead.value=cfg.lead;$('sRotate').checked=cfg.rotate;
}
function openSettings(){fillSettings();$('setDlg').showModal()}
$('setBtnHome').onclick=openSettings;$('setBtn').onclick=openSettings;
$('setForm').onsubmit=e=>{
  e.preventDefault();
  cfg={alert:$('sAlert').value,alertDist:+$('sAlertDist').value,lead:+$('sLead').value,rotate:$('sRotate').checked};
  store('gps-settings',JSON.stringify(cfg));$('setDlg').close();
  if(cfg.alert==='voice')primeVoice();if(cfg.rotate)startCompass();
  if(mode)refreshScreen();applyBearing(true);
};
$('setTest').onclick=()=>{const how=$('sAlert').value;if(how==='voice')primeVoice();alertNow(how,T('sayTurn',T('right'),+$('sAlertDist').value),'turn')};

/* ---------- alerts before turns and articles ---------- */
const VOICE_LANG={he:'he-IL',en:'en-US',de:'de-DE'};
function say(text){
  try{const s=window.speechSynthesis;if(!s)return;s.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=VOICE_LANG[lang];
    const pre=lang==='he'?['he','iw']:[lang];const v=s.getVoices().find(v=>pre.some(x=>(v.lang||'').toLowerCase().startsWith(x)));if(v)u.voice=v;s.speak(u)}catch(e){}
}
// iPhones only speak after a tap; a silent line spoken from a tap unlocks speech for the run
function primeVoice(){try{const s=window.speechSynthesis;if(s){const u=new SpeechSynthesisUtterance(' ');u.volume=0;s.speak(u)}}catch(e){}}
function speechStop(){try{window.speechSynthesis&&window.speechSynthesis.cancel()}catch(e){}}
function alertNow(how,text,kind){if(how==='vibrate')buzz(kind==='turn'?[450]:[120,80,120,80,120]);else if(how==='voice')say(text)}
// each turn and each article is announced once, when the dog's point gets within the chosen distance
function checkAlerts(){
  if(!run||cfg.alert==='none'||!curLoc||curLoc.d>OFF)return;
  run.alerted=run.alerted||{t:[],a:[]};
  const eff=(lastProg||0)+cfg.lead;
  geo.turns.forEach((t,i)=>{const ahead=t.cum-eff;
    if(!run.alerted.t.includes(i)&&ahead<=cfg.alertDist&&ahead>-3){run.alerted.t.push(i);alertNow(cfg.alert,T('sayTurn',T(t.dir),Math.max(0,Math.round(ahead))),'turn')}});
  tr.arts.forEach((a,k)=>{const ahead=a.cum-eff;
    if(!run.found.includes(k)&&!(run.missed||[]).includes(k)&&!run.alerted.a.includes(k)&&ahead<=cfg.alertDist&&ahead>-3){run.alerted.a.push(k);alertNow(cfg.alert,T('sayArt',k+1,Math.max(0,Math.round(ahead)))+(a.note?'. '+a.note:''),'art')}});
}

/* ---------- map follows the phone's heading ---------- */
let heading=null,lastBearing=0,orientOn=false,compassSeen=false;
function screenAngle(){return(screen.orientation&&screen.orientation.angle)||window.orientation||0}
function onOrient(e){
  let h=null;
  if(typeof e.webkitCompassHeading==='number')h=e.webkitCompassHeading;          // iPhone
  else if((e.absolute||e.type==='deviceorientationabsolute')&&typeof e.alpha==='number')h=360-e.alpha; // Android
  if(h==null)return;
  compassSeen=true;setHeading((h+screenAngle())%360);
}
function setHeading(h){heading=h} // the animation loop eases the map toward it
function applyBearing(){if(!cfg.rotate)heading=heading} // kept for callers; the loop reads cfg.rotate every frame
// must start from a tap: iPhones ask for permission to read the compass
function startCompass(){
  if(orientOn||!cfg.rotate)return;
  const listen=()=>{orientOn=true;
    if('ondeviceorientationabsolute' in window)window.addEventListener('deviceorientationabsolute',onOrient);
    else window.addEventListener('deviceorientation',onOrient);
    setTimeout(()=>{if(!compassSeen&&mode&&cfg.rotate)toast(T('noCompass'))},4000);};
  try{
    if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==='function')
      DeviceOrientationEvent.requestPermission().then(r=>{if(r==='granted')listen()}).catch(()=>{});
    else if(window.DeviceOrientationEvent)listen();
  }catch(e){}
}
function syncRotBtn(){const b=$('rotBtn');b.textContent=freeRot?T('rotFree'):cfg.rotate?T('rotOn'):T('rotOff');b.setAttribute('aria-pressed',String(cfg.rotate&&!freeRot));b.hidden=mode==='view'||mode==='preview'}
$('rotBtn').onclick=()=>{if(freeRot){freeRot=false;cfg.rotate=true}else cfg.rotate=!cfg.rotate;store('gps-settings',JSON.stringify(cfg));if(cfg.rotate)startCompass();syncRotBtn();applyBearing(true)};

/* ---------- sharing a track with another phone ---------- */
// The track travels inside the link: points thinned to about 1 m, stored as small integer steps, then compressed.
const b64u=bytes=>{let s='';for(let i=0;i<bytes.length;i+=8192)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const unb64u=str=>{const s=atob(str.replace(/-/g,'+').replace(/_/g,'/'));const b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return b};
async function packTrack(t){
  const P=projector(t.pts[0]),keep=rdp(t.pts.map(P),1),q=v=>Math.round(v*1e5),pts=[];let a0=0,b0=0;
  keep.forEach(i=>{const a=q(t.pts[i][0]),b=q(t.pts[i][1]);pts.push(a-a0,b-b0);a0=a;b0=b});
  const json=JSON.stringify({v:1,n:t.name,s:t.start,e:t.end,p:pts,a:t.arts.map(x=>x.note?[q(x.ll[0]),q(x.ll[1]),x.note]:[q(x.ll[0]),q(x.ll[1])])});
  if(window.CompressionStream){
    const st=new Blob([json]).stream().pipeThrough(new CompressionStream('deflate-raw'));
    return 'z'+b64u(new Uint8Array(await new Response(st).arrayBuffer()));
  }
  return 'j'+b64u(new TextEncoder().encode(json));
}
async function unpackTrack(code){
  let bytes=unb64u(code.slice(1));
  if(code[0]==='z'){const st=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));bytes=new Uint8Array(await new Response(st).arrayBuffer())}
  const o=JSON.parse(new TextDecoder().decode(bytes));
  const pts=[];let a=0,b=0;for(let i=0;i+1<o.p.length;i+=2){a+=o.p[i];b+=o.p[i+1];pts.push([a/1e5,b/1e5,0])}
  if(pts.length<2)throw new Error('short');
  const t={id:'t'+Date.now().toString(36),name:String(o.n||'').slice(0,60),start:+o.s||Date.now(),end:+o.e||Date.now(),pts,arts:[],runs:[]};
  const g=prepare(t);
  t.arts=(o.a||[]).map(x=>{const ll=[x[0]/1e5,x[1]/1e5],a={ll,cum:locate(g,ll,null).cum,t:0};if(typeof x[2]==='string'&&x[2])a.note=x[2].slice(0,140);return a});
  return t;
}
async function shareTrack(t){
  let url;try{url=location.href.split('#')[0]+'#share='+await packTrack(t)}catch(e){return}
  if(navigator.share){try{await navigator.share({title:t.name,text:T('shareText',t.name),url});return}catch(e){if(e&&e.name==='AbortError')return}}
  $('linkIn').value=url;$('linkDlg').showModal();setTimeout(()=>$('linkIn').select(),50);
}
$('linkClose').onclick=()=>$('linkDlg').close();
$('linkCopy').onclick=()=>{const v=$('linkIn').value;
  const ok=()=>{toast(T('linkCopied'));$('linkDlg').close()};
  try{navigator.clipboard.writeText(v).then(ok,()=>{$('linkIn').select();document.execCommand&&document.execCommand('copy')&&ok()})}catch(e){$('linkIn').select()}};
// opening a shared link offers to save the track (its age still counts from when it was laid)
function checkPlan(){
  const m=/^#plan=([^&]+)(?:&n=(.*))?$/.exec(location.hash);if(!m)return false;
  try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
  const code=decodeURIComponent(m[1]),pl=parsePlan(code);
  if(!pl||!pl.legs.length){toast(T('badPlan'));return true}
  if(draftLay()){toast(T('planBusy'));return true}
  pl.code=code;pl.name=m[2]?decodeURIComponent(m[2]).slice(0,40):T('planDefault');pl.total=pl.legs.reduce((a,l)=>a+l.L,0);
  startLay(null,pl);return true;
}
async function checkShared(){
  if(checkPlan())return;
  const m=/^#share=([jz][A-Za-z0-9_-]+)$/.exec(location.hash);if(!m)return;
  try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
  let t;try{t=await unpackTrack(m[1])}catch(e){toast(T('badLink'));return}
  if(tracks().some(x=>x.start===t.start&&x.name===t.name)){toast(T('alreadySaved'));return}
  const len=Math.round(pathLen(t.pts));
  if(await ask(T('importAsk',t.name,len,t.arts.length),T('importYes'))){const all=tracks();all.push(t);saveTracks(all);toast(T('imported'));renderHome()}
}

/* ---------- start ---------- */
applyLang();
renderHome();
checkShared();
window.addEventListener('hashchange',checkShared);
})();
</script>
